name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches project.version
        run: |
          python -c '
          import os, sys, tomllib
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              sys.exit(f"Tag {tag!r} does not match project.version {version!r} (expected v{version})")
          print(f"Tag {tag} matches project.version {version}")
          '

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - name: Smoke test wheel
        run: |
          python -m venv "$RUNNER_TEMP/smoke-venv"
          "$RUNNER_TEMP/smoke-venv/bin/python" -m pip install dist/*.whl
          out="$("$RUNNER_TEMP/smoke-venv/bin/react-agent" "What is 12 * 7?")"
          if [ "$out" != "84" ]; then
            echo "::error::expected '84', got '$out'"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
