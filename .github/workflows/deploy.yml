name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "openspec/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish-image:
    name: Publish container image to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Post-deploy smoke test
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image="$(printf '%s\n' "$TAGS" | grep ':sha-' | head -n 1)"
          if [ -z "$image" ]; then
            echo "::error::no sha tag found in: $TAGS"
            exit 1
          fi
          echo "Smoke testing $image"
          docker pull "$image"
          out="$(docker run --rm "$image" "What is 12 * 7?")"
          echo "answer: $out"
          if [ "$out" != "84" ]; then
            echo "::error::expected '84', got '$out'"
            exit 1
          fi
          echo "### Published \`$image\`" >> "$GITHUB_STEP_SUMMARY"
